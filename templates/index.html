<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CDN Optimizer</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="landing">
  <main class="select-card">
    <h1>CDN OPTIMIZER</h1>
    <p class="muted">Select your location</p>
    <form method="post" action="{{ url_for('choose_location') }}">
      <label class="sr" for="location">Location</label>
      <select id="location" name="location" class="field">
        {% for code, name in locations.items() %}
        <option value="{{ code }}">{{ name }}</option>
        {% endfor %}
      </select>
      <button type="submit" class="btn primary wide">Continue</button>
    </form>
    <p class="hint">Each browser tab is its own user. Open this page again in another tab to add a second location.</p>
  </main>
</body>
</html>
